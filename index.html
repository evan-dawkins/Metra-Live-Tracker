<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metra live network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1A25;        /* night field */
  --lake:#0A1620;
  --shore:#1E3A4C;
  --dot:rgba(140,170,195,.07);
  --ink:#E3EAF0;
  --muted:#8497A8;
  --faint:#3C5062;
  --panel:rgba(15,27,38,.94);
  --edge:#243A4C;
  --live:#5FD39B;
  --warn:#E8B14E;
  --err:#F0766A;
  --tw:3px;            /* track width, set from zoom */
  --sans:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --fade:rgba(14,26,37,0);
  --lakelbl:#1D3444;
  --term:#22384A;
  --hover:rgba(255,255,255,.06);
  --pressed:rgba(255,255,255,.09);
  --soft:rgba(255,255,255,.04);
  --shadow:0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* light theme: same layout and line colours, daylight surfaces */
:root[data-theme="light"]{
  --bg:#EEF2F5;
  --lake:#D9E6EF;
  --shore:#A6BFD0;
  --dot:rgba(40,62,84,.09);
  --ink:#16222E;
  --muted:#5A6A79;
  --faint:#A5B2BD;
  --panel:rgba(255,255,255,.96);
  --edge:#D2DAE1;
  --live:#1B8752;
  --warn:#A96E12;
  --err:#C23E36;
  --fade:rgba(238,242,245,0);
  --lakelbl:#9DB5C6;
  --term:#FFFFFF;
  --hover:rgba(20,34,46,.06);
  --pressed:rgba(20,34,46,.09);
  --soft:rgba(20,34,46,.03);
  --shadow:0 6px 22px rgba(20,34,46,.14);
  color-scheme:light;
}
:root[data-theme="light"] .state.live i{box-shadow:0 0 0 3px rgba(27,135,82,.15)}
:root[data-theme="light"] .train .glow{opacity:.14}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
button:focus-visible,.train:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#stage{position:absolute;inset:0;cursor:grab}
#stage.drag{cursor:grabbing}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg#labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* ---------- top strip ---------- */
.top{position:absolute;left:0;right:0;top:0;height:calc(52px + env(safe-area-inset-top,0px));display:flex;align-items:center;
  justify-content:space-between;padding:env(safe-area-inset-top,0px) calc(18px + env(safe-area-inset-right,0px)) 0 calc(18px + env(safe-area-inset-left,0px));pointer-events:none;
  background:linear-gradient(var(--bg) 55%,var(--fade))}
.top > *{pointer-events:auto}
.mark{display:flex;align-items:baseline;gap:10px}
.mark b{font-size:21px;font-weight:700;letter-spacing:.01em}
.mark span{font-size:14px;color:var(--muted)}
.ops{display:flex;align-items:center;gap:18px;font-size:14px;color:var(--muted);white-space:nowrap}
.ops b{color:var(--ink);font-weight:600}
.state{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:15px}
.state i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.live i{background:var(--live);box-shadow:0 0 0 3px rgba(95,211,155,.16)}
.state.live{color:var(--live)}
.state.busy i{background:var(--live);animation:beat .9s ease-in-out infinite}
.state.busy{color:var(--live)}
.state.warn i{background:var(--warn)} .state.warn{color:var(--warn)}
.state.err i{background:var(--err)} .state.err{color:var(--err)}
.state.sim i{background:none;border:2px solid #A98BF0;width:10px;height:10px} .state.sim{color:#A98BF0}
:root[data-theme="light"] .state.sim{color:#6D4FC4} :root[data-theme="light"] .state.sim i{border-color:#6D4FC4}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
.next{display:flex;align-items:center;gap:6px}
.next svg{width:16px;height:16px;transform:rotate(-90deg)}
.next .trackc{fill:none;stroke:var(--faint);stroke-width:2.4}
.next .prog{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-dasharray:37.7;transition:stroke-dashoffset .9s linear}
.clock{font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- line console ---------- */
.console{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;
  background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:5px;max-width:calc(100vw - 180px);flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:7px;border:0;background:none;
  cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.chip i{width:14px;height:4px;border-radius:2px;flex:none}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--pressed);color:var(--ink)}
.chip .n{font-weight:500;color:var(--muted);font-size:12.5px;min-width:1ch}
.chip.all{color:var(--ink)}
/* ---------- service alerts ---------- */
.abtn{display:none;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:14px;border:1px solid var(--edge);
  background:var(--soft);cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.abtn.show{display:inline-flex}
.abtn svg{width:14px;height:14px;flex:none}
.abtn .ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.abtn.has{color:var(--ink)} .abtn.has .ico{stroke:var(--warn)}
.abtn:hover,.abtn[aria-expanded="true"]{background:var(--pressed)}
.abtn.fresh{animation:alertin 2.4s ease-out}
@keyframes alertin{0%{box-shadow:0 0 0 0 rgba(232,177,78,.55)}100%{box-shadow:0 0 0 10px rgba(232,177,78,0)}}
#apanel{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:392px;
  max-height:min(62vh,560px);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:12px;
  box-shadow:var(--shadow);z-index:5;overflow:hidden;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#apanel.on{display:flex}
#apanel .ahd{display:flex;align-items:baseline;gap:8px;padding:11px 12px 9px 14px;border-bottom:1px solid var(--edge)}
#apanel .ahd b{font-size:15px;font-weight:700}
#apanel .ahd span{font-size:13px;color:var(--muted)}
#apanel .ahd button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;border-radius:5px}
#apanel .ahd button:hover{color:var(--ink);background:var(--hover)}
#apanel .alist{overflow-y:auto;overscroll-behavior:contain}
.aitem{display:grid;grid-template-columns:4px 1fr;gap:0 11px;padding:10px 14px 10px 12px;border-bottom:1px solid var(--edge);cursor:pointer}
.aitem:last-child{border-bottom:0}
.aitem:hover{background:var(--hover)}
.aitem .bars{display:flex;flex-direction:column;gap:2px;border-radius:2px;overflow:hidden}
.aitem .bars i{flex:1;min-height:6px}
.aitem .tags{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.aitem .tags .fx{color:var(--warn);font-weight:600}
.aitem .h{font-size:14.5px;line-height:1.3}
.aitem .more{display:none;margin-top:7px;font-size:13.5px;line-height:1.45;color:var(--muted);white-space:pre-wrap}
.aitem .more a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--faint)}
.aitem.open .more{display:block}
.aitem .chev{float:right;color:var(--faint);font-size:12px;margin-left:6px;transition:transform .15s}
.aitem.open .chev{transform:rotate(180deg)}
#apanel .aempty{padding:18px 14px;font-size:14px;color:var(--muted)}
.chip .ad{width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:-2px;align-self:flex-start;margin-top:8px;display:none}
.chip.alerted .ad{display:block}
.focusnote{font-size:13.5px;color:var(--muted);padding:0 8px 0 4px;display:none}
.focusnote b{color:var(--ink);font-weight:600}
body.focused .focusnote{display:block}

/* ---------- zoom ---------- */
.zoom{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--panel);
  border:1px solid var(--edge);border-radius:10px;padding:5px}
.zoom button{height:30px;min-width:32px;border:0;border-radius:7px;background:none;cursor:pointer;
  font-size:18px;font-weight:600;color:var(--ink);padding:0 9px}
.zoom button.fit,.zoom button.theme{font-size:14px}
.zoom .sep{width:1px;background:var(--edge);margin:4px 2px}
.zoom button:hover{background:var(--hover)}
.zoom button[disabled]{opacity:.35;cursor:default;background:none}

/* ---------- floating train overlay ---------- */
#card{position:absolute;left:0;top:0;width:300px;background:var(--panel);border:1px solid var(--edge);
  border-radius:10px;padding:11px 13px 12px;display:none;font-size:14px;will-change:transform;
  box-shadow:var(--shadow)}
#card.on{display:block}
#card .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#card .bar{width:4px;align-self:stretch;border-radius:2px}
#card .ttl{font-weight:700;font-size:16px;line-height:1.15}
#card .sub{color:var(--muted);font-size:13px}
#card .x{margin-left:auto;align-self:flex-start;background:none;border:0;cursor:pointer;color:var(--muted);
  font-size:18px;line-height:1;padding:2px 4px;border-radius:5px}
#card .x:hover{color:var(--ink);background:var(--hover)}
#card dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:4px 8px}
#card dt{color:var(--muted);font-size:13px;padding-top:1px}
#card dd{margin:0;min-width:0;overflow-wrap:anywhere}
#card .na{color:var(--faint)}
#card .ok{color:var(--live)} #card .wn{color:var(--warn)}
#card .foot{display:flex;gap:6px;margin-top:10px}
#card .foot button{flex:1;height:28px;border-radius:7px;border:1px solid var(--edge);background:var(--soft);
  cursor:pointer;font-size:13.5px;font-weight:600}
#card .foot button:hover{background:var(--pressed)}
#card .foot button[aria-pressed="true"]{border-color:var(--live);color:var(--live)}

/* ---------- tooltip ---------- */
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--edge);border-radius:8px;
  padding:6px 9px;font-size:14px;line-height:1.35;opacity:0;transition:opacity .1s;max-width:260px;z-index:6}
#tip .s{font-size:12.5px;color:var(--muted)}
#tip .lc{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}

/* ---------- notice ---------- */
#notice{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--edge);
  border-radius:9px;padding:9px 14px;font-size:14px;max-width:460px;text-align:center;display:none;color:var(--ink)}
#notice.on{display:block}
#notice span{color:var(--muted)}
#notice .acts{display:flex;gap:8px;justify-content:center;margin-top:8px}
#notice button{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--edge);background:var(--soft);cursor:pointer;
  font-size:14px;font-weight:600}
#notice button:hover{background:var(--pressed)}
#notice button.go{border-color:#A98BF0;color:#A98BF0}
:root[data-theme="light"] #notice button.go{border-color:#6D4FC4;color:#6D4FC4}
body.simmode #notice{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:7px 12px}
body.simmode #notice .acts{display:inline-flex;margin:0 0 0 10px;vertical-align:middle}
body.simmode #notice button{height:26px;font-size:13px}

/* ---------- map ---------- */
.lake{fill:var(--lake)}
.shore{fill:none;stroke:var(--shore);stroke-width:1.2;vector-effect:non-scaling-stroke}
.lakelbl{font-family:var(--sans);font-size:26px;font-weight:500;fill:var(--lakelbl);letter-spacing:.3em}
.track{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:var(--tw);
  transition:opacity .35s}
.stn{fill:var(--bg);stroke-width:1.4;vector-effect:non-scaling-stroke}
.pill{fill:var(--bg);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.term{fill:var(--term);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.dim{opacity:.13}
.stnhit{fill:transparent;cursor:default}
.lbl{font-family:var(--sans);font-size:12.5px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--bg);
  stroke-width:3.2px;stroke-linejoin:round;dominant-baseline:central}
.lbl.t0{font-size:14px;font-weight:700}
.lbl.t1{font-weight:600}
.lbl .alt{fill:var(--muted);font-weight:400}
.lbl .tl{font-size:.72em;stroke-width:2px}

.trail{pointer-events:none;transition:opacity .35s}
.trail path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.trail .tband{stroke-width:calc(var(--tw) + 10px)}
.trail .tcore{stroke-width:2.8px}
:root[data-theme="light"] .trail .tcore{stroke-width:2.4px}
.trail.dim{opacity:.1}
.trail.bye{opacity:0;transition:opacity .8s}
.train{cursor:pointer;transition:opacity .35s}
.train .hit{fill:transparent}
.train .glow{opacity:.2}
.train.stale .glow{opacity:0}
.train .body{stroke:var(--bg);stroke-width:1.7;stroke-linejoin:round}
.train .ring{fill:none;stroke-width:1.4;opacity:0}
.train.ping .ring{animation:ping 1.4s ease-out}
@keyframes ping{0%{opacity:.75;r:7}100%{opacity:0;r:22}}
.train .halo{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:0}
.train:hover .halo{opacity:.45}
.train.sel .halo{opacity:.95}
.train.stale .body{fill:#6B7E8F!important}
.train.stale{opacity:.55}
.train.dim{opacity:.1;pointer-events:none}
.train.bye{opacity:0!important;transition:opacity .8s}
button{touch-action:manipulation}
.short{display:none}
/* ---------- phones and narrow windows ---------- */
@media (max-width:760px){
  .abtn{padding:0 9px 0 8px;height:30px} .abtn .aw{display:none}
  #apanel{left:8px;right:8px;width:auto;top:calc(50px + env(safe-area-inset-top,0px));max-height:64vh}
  .top{height:auto;min-height:calc(46px + env(safe-area-inset-top,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));
    padding-right:calc(12px + env(safe-area-inset-right,0px));gap:10px}
  .mark span,.clock,#nextText,.ops .cnt-word{display:none}
  .mark b{font-size:19px}
  .ops{gap:11px;font-size:13px}
  .state{font-size:14px}
  #updated{max-width:92px;overflow:hidden;text-overflow:ellipsis}
  .long{display:none}.short{display:inline}
  /* line picker: one swipeable row across the bottom */
  .console{left:0;right:0;bottom:0;max-width:none;border-radius:0;border-width:1px 0 0;flex-wrap:nowrap;overflow-x:auto;
    padding:6px calc(8px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px));
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .console::-webkit-scrollbar{display:none}
  .chip{height:36px;flex:none}
  body.focused .focusnote{display:none}
  /* zoom sits just above the line picker */
  .zoom{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .zoom button{height:36px;min-width:38px}
  /* train details become a sheet above the line picker */
  #card{left:8px;right:8px;width:auto;top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:none!important;
    max-height:52vh;overflow-y:auto}
  #card dl{grid-template-columns:96px 1fr}
  #notice{top:calc(54px + env(safe-area-inset-top,0px));max-width:calc(100vw - 24px);font-size:13px}
  body.sheet .zoom{display:none}
}
@media (max-width:420px){ #updated{display:none} }
@media (hover:none){ #tip{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <svg id="map" role="group" aria-label="Schematic map of Metra commuter rail with live train positions"></svg>
  <svg id="labels" aria-hidden="true"></svg>
</div>

<div class="top">
  <div class="mark"><b>Metra</b><span>Live network, Chicago region</span></div>
  <div class="ops">
    <button class="abtn" id="abtn" aria-expanded="false" aria-controls="apanel" title="Metra service alerts"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="ico" d="M8 1.8 L15 14 H1 Z M8 6.2 V9.6 M8 11.6 V11.7"/></svg><span id="acount"></span><span class="aw" id="aword"></span></button>
    <span class="state" id="state"><i></i><span id="stateText">Connecting</span></span>
    <span id="updated">Waiting for first report</span>
    <span class="next" id="next" title="Metra publishes new positions about every 30 seconds"><svg viewBox="0 0 16 16"><circle class="trackc" cx="8" cy="8" r="6"/><circle class="prog" id="prog" cx="8" cy="8" r="6"/></svg><span id="nextText">Next check soon</span></span>
    <span><b id="count">–</b> <span class="cnt-word">trains reporting</span><span class="short">trains</span></span>
    <span class="clock" id="clock"></span>
  </div>
</div>

<div class="console" id="console" role="group" aria-label="Focus a line">
  <span class="focusnote" id="focusnote"></span>
</div>
<div class="zoom">
  <button id="zout" title="Zoom out (−)" aria-label="Zoom out">−</button>
  <button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <button id="fit" class="fit" title="Show the whole network (0)"><span class="long">Whole network</span><span class="short">Fit</span></button>
  <span class="sep" aria-hidden="true"></span>
  <button id="theme" class="theme" aria-pressed="false" title="Switch between dark and light (T)">Light</button>
</div>

<div id="card" role="dialog" aria-label="Train details"></div>
<div id="apanel" role="dialog" aria-label="Service alerts"><div class="ahd"><b>Service alerts</b><span id="ascope"></span><button id="aclose" aria-label="Close alerts">×</button></div><div class="alist" id="alist"></div></div>
<div id="notice" role="status"></div>
<div id="tip"></div>

<script>
(()=>{
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const WORKER_URL="https://transit-aquarium.edawk10.workers.dev";
const WORLD={x0:0,y0:0,x1:1200,y1:1470};

/* =====================================================================
   NETWORK DATA
   Station tuple: [name, lat, lon, id?]. "Primary|Alt" puts the alternate
   name in tooltips/details only. id defaults to the raw name; two
   different stations that share a name get an explicit id.
   Every route is listed downtown-first (s = 0 is the Chicago terminal).
   Schematic geometry (anc) is transcribed from the Metra system diagram:
   H / V / 45° segments only. pins fix a station to an exact spot; the
   stations between pins are spaced evenly along the path.
   sides: preferred label side per anchor segment (L R U D).
   Lat/lon are used only to match GPS fixes to the right place on a line.
   ===================================================================== */
const S=(n,lat,lon,id)=>[n,lat,lon,id];
const OGI=S("Ogilvie",41.8825,-87.6407), CLY=S("Clybourn",41.9168,-87.6682);
const UNI=S("Union Station",41.8787,-87.6403), WAV=S("Western Ave",41.8890,-87.6875);
const RVG=S("River Grove",41.9270,-87.8360), PXC=S("Prairie Crossing",42.3220,-88.0000);
const LSL=S("LaSalle St",41.8753,-87.6320), JOL=S("Joliet",41.5250,-88.0790);
const BLI=S("Blue Island|Vermont St",41.6570,-87.6790);

const UPNW_MAIN=[OGI,CLY,S("Irving Park",41.9525,-87.7295),S("Jefferson Park",41.9707,-87.7610),S("Gladstone Park",41.9795,-87.7785),
  S("Norwood Park",41.9910,-87.7990),S("Edison Park",42.0010,-87.8170),S("Park Ridge",42.0100,-87.8310),S("Dee Road",42.0200,-87.8450),
  S("Des Plaines",42.0410,-87.8830),S("Cumberland",42.0490,-87.8990),S("Mount Prospect",42.0640,-87.9370),S("Arlington Heights",42.0840,-87.9810),
  S("Arlington Park",42.0960,-88.0080),S("Palatine",42.1120,-88.0470),S("Barrington",42.1530,-88.1310),S("Fox River Grove",42.1960,-88.2190),
  S("Cary",42.2090,-88.2420),S("Pingree Road",42.2300,-88.2980)];

/* =====================================================================

   ===================================================================== */
const GLON0=-88.7,GLAT0=42.65,GPX_LON=300,GPX_LAT=400;          // ~0.278 km per unit both ways
function geo(lat,lon){return[(lon-GLON0)*GPX_LON,(GLAT0-lat)*GPX_LAT]}
const MAX_MATCH_D2=22*22;                                         // ~6 km: further than that is not on this line
function cum(p){const c=[0];for(let i=1;i<p.length;i++)c.push(c[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return c}
function along(p,c,d){const tot=c[c.length-1];d=Math.max(0,Math.min(tot,d));
  let i=1;while(i<c.length-1&&c[i]<d)i++;const seg=c[i]-c[i-1]||1,t=(d-c[i-1])/seg;
  return[p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t]}
function project(p,c,q){let best=null;
  for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1;
    let t=((q[0]-a[0])*dx+(q[1]-a[1])*dy)/l2;t=Math.max(0,Math.min(1,t));
    const d=(a[0]+dx*t-q[0])**2+(a[1]+dy*t-q[1])**2;if(!best||d<best.d)best={d,s:c[i-1]+t*(c[i]-c[i-1])}}
  return best.s}
function segAt(c,d){for(let i=1;i<c.length;i++)if(d<c[i]-1e-6)return i-1;return c.length-2}
const SIDE={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
const sid=s=>s[3]||s[0], primary=s=>s[0].split("|")[0], fullName=s=>{const[a,b]=s[0].split("|");return b?`${a} (${b})`:a};
const GEO_ISSUES=[];
for(const key of ORDER){const L=LINES[key];L.key=key;
  L.routes=L.routes.map((r,ri)=>{
    const anc=r.anc,ac=cum(anc),tot=ac[ac.length-1],n=r.st.length,ds=new Array(n).fill(null);
    r.st.forEach((s,i)=>{const pin=r.pins[sid(s)];if(pin)ds[i]=project(anc,ac,pin)});
    if(ds[0]==null)ds[0]=0; if(ds[n-1]==null)ds[n-1]=tot;
    for(let i=0;i<n;i++){if(ds[i]!=null)continue;let j=i;while(ds[j]==null)j++;
      const a=ds[i-1],b=ds[j];for(let k=i;k<j;k++)ds[k]=a+(b-a)*(k-i+1)/(j-i+1);i=j}
    for(let i=1;i<n;i++)if(ds[i]<=ds[i-1])GEO_ISSUES.push(`${L.code} ${ri}: ${sid(r.st[i])} not after ${sid(r.st[i-1])}`);
    const pts=ds.map(d=>along(anc,ac,d)),segs=ds.map(d=>segAt(ac,d));
    return{st:r.st,ids:r.st.map(sid),pts,segs,anc,ac,ds,sides:r.sides,geoPts:r.st.map(s=>geo(s[1],s[2])),branch:(BRANCH_NAMES[key]||[])[ri]||""};
  });
}

function sharedPrefix(L,a,b){if(a===b)return Infinity;const A=L.routes[a].ids,B=L.routes[b].ids;let i=0;
  while(i<A.length&&i<B.length&&A[i]===B[i])i++;return i-1}

/* ---- station records (one per real station, shared across lines) ---- */
const STN=new Map();
for(const key of ORDER){const L=LINES[key];
  L.routes.forEach((r,ri)=>{const last=r.st.length-1;
    r.st.forEach((s,i)=>{const id=sid(s);
      let rec=STN.get(id);
      if(!rec){rec={id,label:primary(s),full:TERMINALS[id]||fullName(s),inst:[],lines:new Set(),terminus:false,rank:99};STN.set(id,rec)}
      const g=r.segs[i],a=r.anc[g],b=r.anc[g+1];let tx=b[0]-a[0],ty=b[1]-a[1];const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
      const pref=SIDE[r.sides[g]]||SIDE.R;let n=[-ty,tx];if(n[0]*pref[0]+n[1]*pref[1]<0)n=[ty,-tx];
      const xy=r.pts[i];
      if(!rec.inst.some(q=>q.key===key&&Math.hypot(q.xy[0]-xy[0],q.xy[1]-xy[1])<.5))rec.inst.push({key,xy,n});
      rec.lines.add(key);if(i===last)rec.terminus=true;
    })})}
for(const rec of STN.values()){
  const xs=rec.inst.map(q=>q.xy[0]),ys=rec.inst.map(q=>q.xy[1]);
  rec.box={x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};
  rec.xy=[(rec.box.x0+rec.box.x1)/2,(rec.box.y0+rec.box.y1)/2];
  rec.n=rec.inst[0].n;
  rec.multi=rec.inst.length>1&&(rec.box.x1-rec.box.x0>1||rec.box.y1-rec.box.y0>1);
  rec.tier=TERMINALS[rec.id]?0:(rec.terminus||rec.lines.size>1)?1:2;
}

let prevShown=new Set(),labelsDirty=true,labelVB=null;
const labelEls=new Map();   // id -> {t, dx, dy} dx/dy = screen offset from station anchor at layout time
function boxHitsSeg(b,a,c){  // Liang–Barsky: does segment a->c enter box b?

    const hx=rec.half[0]*sx+1.5,hy=rec.half[1]*sy+1.5;marks.push({x0:c[0]-hx,y0:c[1]-hy,x1:c[0]+hx,y1:c[1]+hy,id:rec.id,c,hx,hy})}

  for(const r of[consoleR,zoomR])UI.push({x0:r.left-sr.left-4,y0:r.top-sr.top-4,x1:r.right-sr.left+4,y1:r.bottom-sr.top+4});
  const cardEl=$("card");if(cardEl.classList.contains("on")){const r=cardEl.getBoundingClientRect();UI.push({x0:r.left-sr.left,y0:r.top-sr.top,x1:r.right-sr.left,y1:r.bottom-sr.top})}

  const now=new Date();$("clock").textContent=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const left=Math.max(0,nextPollAt-Date.now());
  const frac=inflight?0:Math.min(1,left/POLL);
  $("prog").style.strokeDashoffset=(37.7*(1-frac)).toFixed(2);
  $("nextText").textContent=inflight?"Checking now":nextPollAt?("Next check ~"+Math.max(5,Math.ceil(left/5000)*5)+" s"):"Next check soon";
}

/* ---- tooltip ---- */
const tip=$("tip");
function placeTip(e){const r=stage.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=(e?e.clientX-r.left:r.width/2)+14,y=(e?e.clientY-r.top:r.height/2)+14;
  if(x+tw>r.width-6)x-=tw+28;if(y+th>r.height-6)y-=th+28;tip.style.left=x+"px";tip.style.top=y+"px";tip.style.opacity=1}
function showStationTip(rec,e){
  const lines=[...rec.lines].map(k=>`<span class="lc" style="background:${LINES[k].color}"></span>${LINES[k].code}`).join("&nbsp; ");
  tip.innerHTML=`<div>${rec.full}</div><div class="s">${lines}</div>`;placeTip(e)}
function showTrainTip(t,e){
  tip.innerHTML=`<div><span class="lc" style="background:${t.L.color}"></span>${t.L.code} · ${t.run.kind} ${t.run.val}</div>`
   +`<div class="s">${dirText(t)}${t.stale?" · position out of date":""}</div>`;placeTip(e)}
function hideTip(){tip.style.opacity=0}
function dirText(t){return t.dirSign===0?"Direction not known yet":t.dirSign<0?"Inbound to Chicago":"Outbound from Chicago"}

/* ---- floating train details ---- */
const card=$("card");
function bindTrain(t){
  t.g.addEventListener("pointerenter",e=>{if(!drag||!drag.moved)showTrainTip(t,e)});
  t.g.addEventListener("pointermove",e=>{if(!drag||!drag.moved)showTrainTip(t,e)});
  t.g.addEventListener("pointerleave",hideTip);
  t.g.addEventListener("focus",()=>showTrainTip(t));t.g.addEventListener("blur",hideTip);
  const pick=()=>{hideTip();if(selected===t){closeCard();return}selectTrain(t)};
  t.g.addEventListener("click",e=>{e.stopPropagation();pick()});
  t.g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}});
}
function selectTrain(t){
  if(selected)selected.g.classList.remove("sel");
  selected=t;t.g.classList.add("sel");trainG.appendChild(t.g);
  following=t;card.classList.add("on");document.body.classList.add("sheet");renderCard();
  const r=cw()/ch(),tw=Math.min(vb.w,420);
  flyTo({x:t.shown[0]-tw/2,y:t.shown[1]-(tw/r)/2,w:tw,h:tw/r});labelsDirty=true}
function stopFollowing(){if(!following)return;following=null;if(selected)renderCard()}
function closeCard(){if(selected)selected.g.classList.remove("sel");selected=null;following=null;card.classList.remove("on");document.body.classList.remove("sheet");labelsDirty=true}
const na=s=>`<span class="na">${s}</span>`;
function stationAt(t,i){const r=t.L.routes[t.ri];i=Math.max(0,Math.min(r.st.length-1,i));return STN.get(r.ids[i]).full}
function renderCard(){
  const t=selected;if(!t)return;
  const r=t.L.routes[t.ri],s=t.lastObsS,n=r.st.length;      // the latest REAL fix, never the animated position
  const near=Math.round(s),atStn=Math.abs(s-near)<0.12;
  let last=na("Needs two reports to tell"),next=na("Needs two reports to tell");
  if(t.dirSign!==0){
    const lo=Math.floor(s),hi=Math.min(n-1,Math.ceil(s));
    if(t.dirSign>0){last=stationAt(t,atStn?near:lo);next=atStn?(near<n-1?stationAt(t,near+1):na("End of line")):stationAt(t,hi)}
    else{last=stationAt(t,atStn?near:hi);next=atStn?(near>0?stationAt(t,near-1):na("End of line")):stationAt(t,lo)}
    if(atStn)last=`${last} <span class="na">(at or just leaving)</span>`;
  }
  const age=serverNow()-t.updated,when=new Date(t.updated+clockOffset).toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});
  const status=mode==="sim"?`<span class="na">Simulated, not a real train</span>`:t.stale?`<span class="wn">No new position for ${ago(age).replace(" ago","")}</span>`:`<span class="ok">Reporting</span>`;
  card.innerHTML=
   `<div class="hd"><span class="bar" style="background:${t.L.color}"></span><div><div class="ttl">${t.L.name}</div>`
   +`<div class="sub">${t.run.kind} ${t.run.val}${r.branch?" · "+r.branch:""}</div></div>`
   +`<button class="x" aria-label="Close train details">×</button></div>`
   +`<dl><dt>Direction</dt><dd>${dirText(t)}</dd>`
   +`<dt>Last station</dt><dd>${last}</dd>`
   +`<dt>Departed</dt><dd>${na("Not in live feed")}</dd>`
   +`<dt>Next station</dt><dd>${next}</dd>`
   +`<dt>Arrives</dt><dd>${na("Not in live feed")}</dd>`
   +`<dt>Nearest</dt><dd>${stationAt(t,near)}</dd>`
   +`<dt>GPS report</dt><dd>${mode==="sim"?na("None (simulated)"):`${ago(age)} <span class="na">(${when})</span>`}</dd>`
   +`<dt>Status</dt><dd>${status}</dd>`
   +(t.trip?`<dt>Trip</dt><dd>${String(t.trip).replace(/[<>&]/g,"")}</dd>`:"")
   +`</dl><div class="foot"><button class="fl" aria-pressed="${following===t}">${following===t?"Following":"Follow"}</button></div>`;
  card.querySelector(".x").onclick=closeCard;
  card.querySelector(".fl").onclick=()=>{if(following===t){following=null}else{following=t}renderCard()};
}
function placeCard(){
  if(!selected)return;const sx=cw()/vb.w,sy=ch()/vb.h;
  const px=(selected.shown[0]-vb.x)*sx,py=(selected.shown[1]-vb.y)*sy;
  const w=card.offsetWidth,h=card.offsetHeight,W=cw(),H=ch();
  let x=px+22,y=py-h/2;if(x+w>W-12)x=px-22-w;
  if(isNarrow()){card.style.transform="";return}          // phone: CSS docks it as a bottom sheet
  const I=uiInsets();x=Math.max(12,Math.min(W-w-12,x));y=Math.max(I.top,Math.min(H-I.bot-h-6,y));
  card.style.transform=`translate(${x.toFixed(0)}px,${y.toFixed(0)}px)`}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
FIT_W=fitAll().w;vb=fitAll();applyVB();syncZoom();
let lastFrame=performance.now(),labelT=0,cardT=0,statusT=0,lastVB="",lastMarkW=-1;
function frame(now){
  const dt=Math.min(.25,(now-lastFrame)/1000);lastFrame=now;
  const sNow=serverNow(),k=vb.w/cw();
  for(const t of trains){
    const r=t.L.routes[t.ri],s=curS(t,now),p=poseAt(r,s);t.shown=[p.x,p.y];
    const stale=sNow-t.updated>STALE_AFTER;
    if(stale!==t.stale){t.stale=stale;t.g.classList.toggle("stale",stale)}
    drawTrail(t,r,p,now,k);
    const known=t.dirSign!==0;
    t.arrow.style.display=known?"":"none";t.dot.style.display=known?"none":"";
    t.g.setAttribute("transform",`translate(${p.x.toFixed(2)},${p.y.toFixed(2)}) scale(${k.toFixed(4)})`);
    if(known)t.inner.setAttribute("transform",`rotate(${((t.dirSign<0?p.ang+Math.PI:p.ang)*180/Math.PI).toFixed(1)})`);
    const a=`${t.L.name} line, ${t.run.kind.toLowerCase()} ${t.run.val}, ${dirText(t).toLowerCase()}${t.stale?", position out of date":""}`;
    if(a!==t.a11y){t.a11y=a;t.g.firstChild.textContent=a}
  }
  if(following&&!camAnim&&!drag){
    const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;
    let oy=0;if(isNarrow()&&card.classList.contains("on"))oy=card.offsetHeight/2*(vb.h/ch());
    vb.x+=(following.shown[0]-cx)*.05;vb.y+=(following.shown[1]+oy-cy)*.05;
  }
  if(camAnim)camAnim(now);
  applyVB();
  const key=vb.x.toFixed(2)+","+vb.y.toFixed(2)+","+vb.w.toFixed(2);
  if(key!==lastVB){lastVB=key;labelsDirty=true;
    const z=FIT_W/vb.w;document.documentElement.style.setProperty("--tw",Math.max(2.4,Math.min(6.5,2.6+1.5*Math.log2(Math.max(1,z)))).toFixed(2)+"px");
    if(Math.abs(vb.w-lastMarkW)>1e-6){lastMarkW=vb.w;updateMarkers()}
    positionLabels()}
  labelT-=dt;if(labelT<=0&&labelsDirty){labelT=.12;labelsDirty=false;renderLabels()}
  placeCard();
  cardT-=dt;if(cardT<=0){cardT=1;if(selected)renderCard()}
  statusT-=dt;if(statusT<=0){statusT=1;refreshStatus();tickHeader()}
  requestAnimationFrame(frame);
}
if(GEO_ISSUES.length)console.warn("Schematic ordering issues:",GEO_ISSUES);
window.__metra={takeAlerts,get alerts(){return alerts},startSim,stopSim,get mode(){return mode},poll,LINES,STN,STATIONS,GEO_ISSUES,layoutLabels,ingest,get trains(){return trains},get vb(){return vb},set vb(v){vb=v},renderLabels,setFocus,selectTrain,fitAll};
tickHeader();poll();requestAnimationFrame(frame);
})();
</script>
</body>
